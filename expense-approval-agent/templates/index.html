<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>企业费用报销中心</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">费</span>
      <div>
        <h1>企业费用报销中心</h1>
        <p>材料预审、审批流转与审计留痕</p>
      </div>
    </div>
    <div class="identity">
      <label for="identity-select">当前身份</label>
      <select id="identity-select" aria-label="切换演示身份"></select>
    </div>
  </header>

  <nav class="tabs" aria-label="费用报销功能">
    <button class="tab active" data-tab="submit">发起报销</button>
    <button class="tab" data-tab="pending">待我处理 <span id="pending-count"></span></button>
    <button class="tab" data-tab="records">申请记录</button>
  </nav>

  <main class="page">
    <section id="submit-view" class="view active">
      <div class="section-head">
        <div>
          <h2>发起费用报销</h2>
          <p>员工与部门来自当前登录身份，金额和审批结论由规则引擎校验。</p>
        </div>
        <span class="ai-boundary">AI仅辅助材料理解</span>
      </div>

      <div id="profile-card" class="profile-card"></div>

      <form id="expense-form" class="expense-form">
        <div class="field">
          <label for="expense-type">费用类型</label>
          <select id="expense-type" name="expense_type" required>
            <option value="">请选择费用类型</option>
            <option>交通费</option>
            <option>餐饮费</option>
            <option>差旅费</option>
            <option>办公费</option>
          </select>
        </div>
        <div class="field">
          <label for="amount">报销金额（元）</label>
          <input id="amount" name="amount" type="number" min="0.01" step="0.01" required>
        </div>
        <div class="field">
          <label for="invoice-no">发票号码</label>
          <input id="invoice-no" name="invoice_no" autocomplete="off" required>
        </div>
        <div class="field">
          <label for="expense-date">费用发生日期</label>
          <input id="expense-date" name="expense_date" type="date" required>
        </div>
        <div class="field full">
          <label for="purpose">用途说明</label>
          <textarea id="purpose" name="purpose" rows="4" placeholder="请说明业务目的、对象、地点或行程信息" required></textarea>
          <small>大模型只检查材料表达是否清楚，不参与金额和最终审批。</small>
        </div>
        <div class="field full">
          <label for="attachment">票据附件（可选）</label>
          <input id="attachment" type="file" accept=".pdf,.png,.jpg,.jpeg">
          <small id="attachment-status">支持PDF、PNG、JPG、JPEG，单个文件不超过5MB。</small>
        </div>
        <div class="form-actions">
          <button type="button" class="button secondary" id="reset-form">清空</button>
          <button type="submit" class="button primary" id="submit-button">提交预审</button>
        </div>
      </form>

      <section id="decision-panel" class="decision-panel hidden" aria-live="polite"></section>
    </section>

    <section id="pending-view" class="view">
      <div class="section-head">
        <div>
          <h2>待我处理</h2>
          <p id="pending-description">仅展示当前身份有权限处理的申请。</p>
        </div>
        <button class="button secondary refresh-list" data-scope="pending">刷新</button>
      </div>
      <div id="pending-list" class="application-list"></div>
    </section>

    <section id="records-view" class="view">
      <div class="section-head">
        <div>
          <h2>申请记录</h2>
          <p>查看申请状态、审批动作和完整审计时间线。</p>
        </div>
        <button class="button secondary refresh-list" data-scope="all">刷新</button>
      </div>
      <div id="records-list" class="application-list"></div>
    </section>
  </main>

  <dialog id="detail-dialog" class="detail-dialog">
    <div class="dialog-head">
      <div>
        <span class="eyebrow">报销申请详情</span>
        <h2 id="detail-title">申请单</h2>
      </div>
      <button class="icon-button" id="close-detail" aria-label="关闭详情">×</button>
    </div>
    <div id="detail-content"></div>
  </dialog>

  <div id="toast" class="toast hidden" role="status"></div>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
